<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS Drum Machine</title>
    <style>
        :root {
            --bg-color: #282c34;
            --main-color: #61afef;
            --accent-color: #e06c75;
            --light-grey: #4b5263;
            --dark-grey: #21252b;
            --font-color: #abb2bf;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--font-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        .drum-machine {
            background-color: var(--dark-grey);
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 95%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            color: var(--main-color);
            font-weight: 300;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .controls button {
            background-color: var(--main-color);
            border: none;
            color: var(--dark-grey);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .controls button:hover {
            background-color: #82c0ff;
        }

        .tempo {
            display: flex;
            align-items: center;
        }

        .tempo-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 150px;
            height: 8px;
            background: var(--light-grey);
            outline: none;
            border-radius: 5px;
            margin: 0 10px;
        }

        .tempo-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            cursor: pointer;
            border-radius: 50%;
        }

        .tempo-slider::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--accent-color);
            cursor: pointer;
            border-radius: 50%;
        }

        #bpm-display {
            min-width: 40px;
            text-align: right;
            font-weight: bold;
        }

        .grid-container {
            display: grid;
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
        }

        .instrument-row {
            display: grid;
            grid-template-columns: 80px repeat(16, 1fr);
            gap: 5px;
            align-items: center;
        }

        .instrument-label {
            font-weight: bold;
            text-align: right;
            padding-right: 10px;
            font-size: 0.9em;
        }

        .step {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: var(--light-grey);
            border: 1px solid var(--dark-grey);
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.1s, transform 0.1s;
        }

        .step.active {
            background-color: var(--main-color);
            transform: scale(1.05);
            box-shadow: 0 0 10px var(--main-color);
        }

        .step.current {
            outline: 2px solid var(--accent-color);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <div class="drum-machine">
        <h1>Drum Machine</h1>
        <div class="controls">
            <button id="play-stop-btn">Play</button>
            <div class="tempo">
                <label for="tempo">BPM:</label>
                <input type="range" min="40" max="240" value="120" class="tempo-slider" id="tempo-slider">
                <span id="bpm-display">120</span>
            </div>
        </div>
        <div class="grid-container" id="grid-container">
            <!-- Rows will be generated by JavaScript -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- Elements ---
            const gridContainer = document.getElementById('grid-container');
            const playStopBtn = document.getElementById('play-stop-btn');
            const tempoSlider = document.getElementById('tempo-slider');
            const bpmDisplay = document.getElementById('bpm-display');

            // --- Constants ---
            const NUM_INSTRUMENTS = 4;
            const NUM_STEPS = 16;
            const instrumentNames = ['Kick', 'Snare', 'Hi-Hat', 'Tom'];

            // --- State ---
            let audioContext;
            let sequence;
            let isPlaying = false;
            let currentStep = 0;
            let bpm = 120;
            let nextNoteTime = 0.0;
            let timerId;

            // --- Web Audio API Sound Synthesis ---
            function initAudio() {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            
            function playKick(time) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
                
                gain.gain.setValueAtTime(1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                osc.start(time);
                osc.stop(time + 0.15);
            }

            function playSnare(time) {
                const noise = audioContext.createBufferSource();
                const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                noise.buffer = buffer;

                const noiseFilter = audioContext.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 1000;
                noise.connect(noiseFilter);

                const noiseEnvelope = audioContext.createGain();
                noiseFilter.connect(noiseEnvelope);
                noiseEnvelope.connect(audioContext.destination);
                
                noiseEnvelope.gain.setValueAtTime(1, time);
                noiseEnvelope.gain.exponentialRampToValueAtTime(0.01, time + 0.15);

                const osc = audioContext.createOscillator();
                osc.type = 'triangle';
                const oscEnvelope = audioContext.createGain();
                osc.connect(oscEnvelope);
                oscEnvelope.connect(audioContext.destination);
                
                osc.frequency.setValueAtTime(100, time);
                oscEnvelope.gain.setValueAtTime(0.7, time);
                oscEnvelope.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                noise.start(time);
                osc.start(time);
                noise.stop(time + 0.2);
                osc.stop(time + 0.1);
            }

            function playHiHat(time) {
                const noise = audioContext.createBufferSource();
                const buffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.1, audioContext.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < data.length; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                noise.buffer = buffer;

                const bandpass = audioContext.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 10000;
                
                const highpass = audioContext.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 7000;

                noise.connect(bandpass).connect(highpass);

                const envelope = audioContext.createGain();
                highpass.connect(envelope);
                envelope.connect(audioContext.destination);

                envelope.gain.setValueAtTime(1, time);
                envelope.gain.exponentialRampToValueAtTime(0.01, time + 0.05);

                noise.start(time);
                noise.stop(time + 0.1);
            }

            function playTom(time) {
                const osc = audioContext.createOscillator();
                const gain = audioContext.createGain();
                osc.connect(gain);
                gain.connect(audioContext.destination);

                osc.frequency.setValueAtTime(250, time);
                osc.frequency.exponentialRampToValueAtTime(100, time + 0.2);
                
                gain.gain.setValueAtTime(0.8, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

                osc.start(time);
                osc.stop(time + 0.25);
            }
            
            const instrumentPlayer = [playKick, playSnare, playHiHat, playTom];

            // --- Sequencer Logic ---
            function scheduler() {
                while (nextNoteTime < audioContext.currentTime + 0.1) {
                    playStep(currentStep, nextNoteTime);
                    updateScheduler();
                }
                timerId = window.setTimeout(scheduler, 25.0);
            }

            function updateScheduler() {
                const secondsPerBeat = 60.0 / bpm;
                const secondsPer16thNote = secondsPerBeat / 4;
                nextNoteTime += secondsPer16thNote;

                currentStep = (currentStep + 1) % NUM_STEPS;
            }

            function playStep(stepIndex, time) {
                for (let i = 0; i < NUM_INSTRUMENTS; i++) {
                    if (sequence[i][stepIndex]) {
                        instrumentPlayer[i](time);
                    }
                }
                // Update UI on a separate, less time-critical path
                setTimeout(() => updateGridHighlight(stepIndex), 0);
            }

            function togglePlay() {
                // Handle AudioContext suspension on first user gesture
                if (!audioContext) initAudio();
                if (audioContext.state === 'suspended') {
                    audioContext.resume();
                }

                isPlaying = !isPlaying;

                if (isPlaying) {
                    currentStep = 0;
                    nextNoteTime = audioContext.currentTime;
                    scheduler();
                    playStopBtn.textContent = 'Stop';
                } else {
                    window.clearTimeout(timerId);
                    playStopBtn.textContent = 'Play';
                    clearGridHighlight();
                }
            }

            // --- UI ---
            function createGrid() {
                sequence = Array(NUM_INSTRUMENTS).fill(null).map(() => Array(NUM_STEPS).fill(false));

                for (let i = 0; i < NUM_INSTRUMENTS; i++) {
                    const row = document.createElement('div');
                    row.classList.add('instrument-row');
                    
                    const label = document.createElement('div');
                    label.classList.add('instrument-label');
                    label.textContent = instrumentNames[i];
                    row.appendChild(label);

                    for (let j = 0; j < NUM_STEPS; j++) {
                        const step = document.createElement('div');
                        step.classList.add('step');
                        step.dataset.instrument = i;
                        step.dataset.step = j;
                        row.appendChild(step);
                    }
                    gridContainer.appendChild(row);
                }
            }

            function handleGridClick(e) {
                if (e.target.classList.contains('step')) {
                    const instrument = parseInt(e.target.dataset.instrument);
                    const step = parseInt(e.target.dataset.step);

                    sequence[instrument][step] = !sequence[instrument][step];
                    e.target.classList.toggle('active', sequence[instrument][step]);
                }
            }

            function handleTempoChange(e) {
                bpm = parseInt(e.target.value);
                bpmDisplay.textContent = bpm;
            }

            function updateGridHighlight(stepIndex) {
                clearGridHighlight();
                const stepsToHighlight = document.querySelectorAll(`.step[data-step='${stepIndex}']`);
                stepsToHighlight.forEach(step => step.classList.add('current'));
            }

            function clearGridHighlight() {
                const highlightedSteps = document.querySelectorAll('.step.current');
                highlightedSteps.forEach(step => step.classList.remove('current'));
            }

            // --- Initialization ---
            createGrid();
            playStopBtn.addEventListener('click', togglePlay);
            tempoSlider.addEventListener('input', handleTempoChange);
            gridContainer.addEventListener('click', handleGridClick);
        });
    </script>
</body>
</html>
